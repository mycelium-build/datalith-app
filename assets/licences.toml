# Canonical inventory of non-Cargo assets embedded in or distributed with
# Datalith. Generated notice content (assets/licenses/generated.md and the
# asset sections of THIRD-PARTY-NOTICES.md) is derived from this file, which is
# validated by scripts/licenses/check_assets.py.
#
# Field notes:
#   paths      repo-relative file/glob patterns covered by this entry
#   source     upstream URL, or "first-party" for original Datalith assets
#   revision   immutable upstream identifier where available
#   license    SPDX expression, or a LicenseRef-* for non-standard grants
#   license_file  path to the retained, exact license text
#   distribution  "embedded" (compiled into the binary) or "packaged" (installed
#                 beside it) or "dependency" (arrives via a Rust dependency)

# gpui-component adaptation revision (the point at which Datalith obtained the
# bundled themes and component assets).
ADAPTATION_SOURCE = "https://github.com/longbridge/gpui-component"
ADAPTATION_REVISION = "46576ae7aa63ab9db9923e5d8c32228ed330a259"

[[asset]]
id = "datalith-pixel-icons"
kind = "icon"
name = "Datalith pixel-art icons"
author = "Datalith"
copyright = "Copyright (c) 2026 mycelium-build"
source = "first-party"
revision = "first-party"
license = "MIT"
license_file = "LICENSE"
distribution = "embedded"
paths = ["assets/icons/*.svg", "assets/icons/*.txt"]
notes = "Original 7x7 pixel art generated from ASCII sources (scripts/txt2svg.py). Stylistically inspired by line-icon sets such as Nucleo Arcade."

[[asset]]
id = "datalith-app-icons"
kind = "artwork"
name = "Datalith application icon and artwork"
author = "Datalith"
copyright = "Copyright (c) 2026 mycelium-build"
source = "first-party"
revision = "first-party"
license = "MIT"
license_file = "LICENSE"
distribution = "packaged"
paths = [
    "assets/datalith.png",
    "assets/datalith.ico",
    "assets/datalith.icns",
    "assets/datalith-macos.png",
    "assets/datalith.svg",
    "assets/datalith.txt",
    "assets/datalith.rc",
    "assets/icons/hicolor/**",
]

[[asset]]
id = "theme-datalith"
kind = "theme"
name = "Datalith"
author = "Datalith"
copyright = "Copyright (c) 2026 mycelium-build"
source = "first-party"
revision = "first-party"
license = "MIT"
license_file = "LICENSE"
distribution = "embedded"
paths = ["src/ui/themes/datalith.json"]

[[asset]]
id = "pixeloid"
kind = "font"
name = "Pixeloid Sans"
author = "GGBotNet"
copyright = "Copyright (c) 2020-2025 GGBotNet"
source = "https://ggbot.net/fonts/"
revision = "ggbot.net release (see font metadata for version)"
license = "OFL-1.1"
license_file = "assets/fonts/Pixeloid/LICENSE.txt"
reserved_names = ["Pixeloid"]
distribution = "embedded"
paths = [
    "assets/fonts/Pixeloid/PixeloidSans.ttf",
    "assets/fonts/Pixeloid/PixeloidSans-Bold.ttf",
    "assets/fonts/Pixeloid/LICENSE.txt",
]

