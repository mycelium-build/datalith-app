# Canonical inventory of non-Cargo assets embedded in or distributed with Datalith.
# The asset sections of THIRD-PARTY-NOTICES.md are derived from assets/licenses.toml,
# which is validated by scripts/licenses/check_assets.py.
#
# Field notes:
#   paths         repo-relative file/glob patterns covered by this entry
#   source        upstream URL, or "first-party" for original Datalith assets
#   revision      immutable upstream license-evidence identifier where available;
#                 theme acquisition is recorded separately by adaptation_revision
#   license       SPDX expression, or a LicenseRef-* for non-standard grants
#   license_file  path to the retained, exact license text
#   distribution  "embedded" (compiled into the binary)
#                 or "packaged" (installed beside it)
#                 or "dependency" (arrives via a Rust dependency)

# gpui-component adaptation revision
# (the point at which Datalith obtained the bundled themes and component assets).
ADAPTATION_SOURCE = "https://github.com/longbridge/gpui-component"
ADAPTATION_REVISION = "46576ae7aa63ab9db9923e5d8c32228ed330a259"

[[asset]]
id = "datalith-pixel-icons"
kind = "icon"
name = "Datalith pixel-art icons"
author = "Datalith"
copyright = "Copyright (c) 2026 mycelium-build"
source = "first-party"
revision = "first-party"
license = "MIT"
license_file = "LICENSE"
distribution = "embedded"
paths = ["assets/icons/*.svg", "assets/icons/*.txt"]
notes = "Original 7x7 and 2 color levels pixel art icons. Inspired by Nucleo Arcade icon sets."

[[asset]]
id = "datalith-app-icons"
kind = "artwork"
name = "Datalith application icon"
author = "Datalith"
copyright = "Copyright (c) 2026 mycelium-build"
source = "first-party"
revision = "first-party"
license = "MIT"
license_file = "LICENSE"
distribution = "packaged"
paths = [
    "assets/logo/datalith.png",
    "assets/logo/datalith.ico",
    "assets/logo/datalith.icns",
    "assets/logo/datalith-macos.png",
    "assets/logo/datalith.svg",
    "assets/logo/datalith.txt",
    "assets/logo/datalith.rc",
    "assets/logo/hicolor/**",
]

[[asset]]
id = "theme-datalith"
kind = "theme"
name = "Datalith"
author = "Datalith"
copyright = "Copyright (c) 2026 mycelium-build"
source = "first-party"
revision = "first-party"
license = "MIT"
license_file = "assets/themes/datalith-LICENSE.txt"
distribution = "embedded"
paths = ["assets/themes/datalith.json"]

[[asset]]
id = "pixeloid"
kind = "font"
name = "Pixeloid Sans"
author = "GGBotNet"
copyright = "Copyright (c) 2020-2025 GGBotNet"
source = "https://ggbot.net/fonts/"
revision = "1.0 (embedded font metadata)"
license = "OFL-1.1"
license_file = "assets/fonts/Pixeloid/LICENSE.txt"
reserved_names = ["Pixeloid"]
notes = "The publisher does not expose a stable versioned archive. Exact bundled files are identified by SHA-256: regular 6c74e947e13eac61b3199cfe85ae78d3b27865aec4b9b4b39a05d34518d3bb3e; bold d8bc38413101440e2d68b8d886f82dae298e3d4550728b5c99f717377ed8a195; OFL text de7a71bd2d330c09aaadb38cd09eda3c62693a55350e288b43dac73f4a5e67a8."
distribution = "embedded"
paths = [
    "assets/fonts/Pixeloid/PixeloidSans.ttf",
    "assets/fonts/Pixeloid/PixeloidSans-Bold.ttf",
    "assets/fonts/Pixeloid/LICENSE.txt",
]

