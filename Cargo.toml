[package]
name = "datalith"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "dadfca97fec7221acf3ce7047bccdc1eac0506b9", features = ["tree-sitter-markdown"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "dadfca97fec7221acf3ce7047bccdc1eac0506b9" }
anyhow = "1.0"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
arboard = "3"
tantivy = "0.26"
pulldown-cmark = "0.13"
percent-encoding = "2.3.2"
txtodo = "1.0.0"
time = "0.3.53"
