[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "apps/mobile",
  "crates/datalith-core",
  "crates/datalith-server",
  "crates/datalith-ui",
  "crates/datalith-vault",
]
# `cargo build`, `cargo run` and `cargo build --release` at the root build the desktop app.
default-members = ["apps/desktop"]

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/mycelium-build/datalith-app"
publish = false

[workspace.dependencies]
datalith-core = { path = "crates/datalith-core" }
datalith-server = { path = "crates/datalith-server" }
datalith-ui = { path = "crates/datalith-ui" }
datalith-vault = { path = "crates/datalith-vault" }

gpui-kit = { version = "0.9.0", features = [
  "tree-sitter-markdown",
  "tree-sitter-yaml",
] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3.4" }
cargo-packager-updater = "0.2.3"
anyhow = "1.0"
futures = "0.3"
dirs = "7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
arboard = "3"
tantivy = "0.27"
levenshtein_automata = "0.2.1"
tantivy-fst = "0.5"
pulldown-cmark = "0.13"
percent-encoding = "2.3.2"
txtodo = "1.0.2"
time = "0.3.53"
notify = "8.2.0"
yaml_serde = "0.10.4"
rand = "0.10.2"
pollster = "1.0.1"
turso = { version = "0.8.0", default-features = false }
rayon = "1.12.0"
conv = "0.3.3"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
embed-resource = "3.0.9"
criterion = { version = "0.8.2", features = ["html_reports"] }
minisign = "0.10"
base64 = "0.23"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
excessive_nesting = "deny"
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.dev.package."*"]
debug = "line-tables-only"
