[package]
name = "datalith"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mycelium-build/datalith"
publish = false

[package.metadata.packager]
product-name = "Datalith"
identifier = "build.mycelium.datalith"
publisher = "Mycelium Build"
description = "A fast, local-first knowledge workspace."
homepage = "https://github.com/mycelium-build/datalith"
category = "Productivity"
icons = ["assets/datalith.png", "assets/datalith.icns"]
license-file = "LICENSE"
formats = ["appimage", "dmg", "nsis"]

[package.metadata.packager.nsis]
installMode = "currentUser"
installer-icon = "assets/datalith.ico"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.9"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "46576ae7aa63ab9db9923e5d8c32228ed330a259", features = [
  "tree-sitter-markdown",
  "tree-sitter-yaml",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "46576ae7aa63ab9db9923e5d8c32228ed330a259" }
anyhow = "1.0"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
arboard = "3"
tantivy = "0.26"
pulldown-cmark = "0.13"
percent-encoding = "2.3.2"
txtodo = "1.0.2"
time = "0.3.53"
notify = "8.2.0"
yaml_serde = "0.10.4"
pollster = "1.0.1"
turso = { version = "0.7.0", default-features = false }
rayon = "1.12.0"
conv = "0.3.3"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.2"

[[bench]]
name = "catalog"
harness = false

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
