[package]
name = "datalith"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mycelium-build/datalith"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "dadfca97fec7221acf3ce7047bccdc1eac0506b9", features = [
  "tree-sitter-markdown",
  "tree-sitter-yaml",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "dadfca97fec7221acf3ce7047bccdc1eac0506b9" }
anyhow = "1.0"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
arboard = "3"
tantivy = "0.26"
pulldown-cmark = "0.13"
percent-encoding = "2.3.2"
txtodo = "1.0.2"
time = "0.3.53"
notify = "8.2.0"
yaml_serde = "0.10.4"
pollster = "1.0.1"
turso = { version = "0.7.0", default-features = false }
rayon = "1.12.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.2"

[[bench]]
name = "catalog"
harness = false
