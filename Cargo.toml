[package]
name = "datalith"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mycelium-build/datalith-app"

[[package.metadata.packager.deep_link_protocols]]
name = "Datalith"
schemes = ["datalith"]

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.9"

[dependencies]
gpui-kit = { version = "0.6.1", features = [
  "tree-sitter-markdown",
  "tree-sitter-yaml",
] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3.4" }
cargo-packager-updater = "0.2.3"
anyhow = "1.0"
futures = "0.3"
dirs = "6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
arboard = "3"
tantivy = "0.26"
pulldown-cmark = "0.13"
percent-encoding = "2.3.2"
txtodo = "1.0.2"
time = "0.3.53"
notify = "8.2.0"
yaml_serde = "0.10.4"
rand = "0.10.2"
pollster = "1.0.1"
turso = { version = "0.7.0", default-features = false }
rayon = "1.12.0"
conv = "0.3.3"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
poem = { version = "3.1.12", features = ["test"] }
minisign = "0.7"
base64 = "0.22"

[[bench]]
name = "catalog"
harness = false

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
