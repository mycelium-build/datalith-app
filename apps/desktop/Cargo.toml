[package]
name = "datalith-desktop"
description = "The Datalith desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "datalith"

[[bin]]
name = "datalith"
path = "src/main.rs"

[[package.metadata.packager.deep_link_protocols]]
name = "Datalith"
schemes = ["datalith"]

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[dependencies]
datalith-core.workspace = true
datalith-server.workspace = true
datalith-ui.workspace = true
datalith-vault.workspace = true
gpui-kit.workspace = true
reqwest_client.workspace = true
cargo-packager-updater.workspace = true
anyhow.workspace = true
futures.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
arboard.workspace = true
percent-encoding.workspace = true
time.workspace = true
rand.workspace = true
conv.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
minisign.workspace = true
base64.workspace = true

[lints]
workspace = true
