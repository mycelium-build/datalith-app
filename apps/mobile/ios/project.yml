name: Datalith
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Datalith:
    type: application
    platform: iOS
    sources:
      - main.c
      - Controls.m
      - Folders.m
      - path: ../../../assets/logo/stable/datalith.icon
        buildPhase: resources
        type: file
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Datalith
        CFBundleURLTypes:
          - CFBundleURLName: build.mycelium.datalith
            CFBundleURLSchemes: [datalith]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: GPUIIosSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: build.mycelium.datalith.ios-smoke
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: datalith
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: "$(inherited) @$(DERIVED_FILE_DIR)/rust-link-flags"
    preBuildScripts:
      - name: Compile Datalith for iPhone
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(DERIVED_FILE_DIR)/rust-link-flags"
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          cd "$SRCROOT/../../.."
          export CARGO_PROFILE_DEV_DEBUG=0
          export CARGO_TARGET_DIR="$SRCROOT/target"
          case "$CONFIGURATION" in
            Release) profile=release ;;
            *) profile=dev ;;
          esac
          case "$PLATFORM_NAME" in
            iphonesimulator) triple=aarch64-apple-ios-sim ;;
            *) triple=aarch64-apple-ios ;;
          esac
          cargo rustc -p datalith-mobile --locked --lib --crate-type staticlib --profile "$profile" --target "$triple" -- --print native-static-libs 2>"$DERIVED_FILE_DIR/cargo.log" || { cat "$DERIVED_FILE_DIR/cargo.log"; exit 1; }
          output="$profile"
          if [ "$profile" = dev ]; then output=debug; fi
          flags=$(sed -n 's/^note: native-static-libs: //p' "$DERIVED_FILE_DIR/cargo.log")
          test -n "$flags" || { cat "$DERIVED_FILE_DIR/cargo.log"; exit 1; }
          printf '"%s" %s\n' "$SRCROOT/target/$triple/$output/libdatalith_mobile.a" "$flags" > "$DERIVED_FILE_DIR/rust-link-flags"
