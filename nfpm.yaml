# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: ${PACKAGE_STEM}
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
release: "1"
section: utils
priority: optional
maintainer: lmandrelli <luca.mandrelli@icloud.com>
description: A fast, local-first knowledge workspace.
vendor: Mycelium Build
homepage: https://github.com/mycelium-build/datalith-app
license: MIT

contents:
  - src: target/${PACKAGE_TARGET}/release/${PACKAGE_STEM}
    dst: /usr/bin/${PACKAGE_STEM}
    expand: true
    file_info:
      mode: 0755
  - src: packaging/${PACKAGE_STEM}.desktop
    dst: /usr/share/applications/${PACKAGE_STEM}.desktop
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/datalith.svg
    dst: /usr/share/icons/hicolor/scalable/apps/${PACKAGE_STEM}.svg
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/16x16/apps/datalith.png
    dst: /usr/share/icons/hicolor/16x16/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/32x32/apps/datalith.png
    dst: /usr/share/icons/hicolor/32x32/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/48x48/apps/datalith.png
    dst: /usr/share/icons/hicolor/48x48/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/64x64/apps/datalith.png
    dst: /usr/share/icons/hicolor/64x64/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/128x128/apps/datalith.png
    dst: /usr/share/icons/hicolor/128x128/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/256x256/apps/datalith.png
    dst: /usr/share/icons/hicolor/256x256/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/512x512/apps/datalith.png
    dst: /usr/share/icons/hicolor/512x512/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: assets/logo/${PACKAGE_CHANNEL}/hicolor/1024x1024/apps/datalith.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/${PACKAGE_STEM}.png
    expand: true
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/${PACKAGE_STEM}/LICENSE
    expand: true
    file_info:
      mode: 0644
  - src: LICENSING.md
    dst: /usr/share/licenses/${PACKAGE_STEM}/LICENSING.md
    expand: true
    file_info:
      mode: 0644
  - src: THIRD-PARTY-NOTICES.md
    dst: /usr/share/licenses/${PACKAGE_STEM}/THIRD-PARTY-NOTICES.md
    expand: true
    file_info:
      mode: 0644

# Runtime deps derived from the release binary (`readelf -d` + dlopen'd libs
# for the wgpu/wayland/x11 backends). No fontconfig or alsa: fontconfig_parser
# is a pure-Rust crate and Datalith has no audio stack.
overrides:
  deb:
    depends:
      - libgcc-s1
      - libwayland-client0
      - libwayland-egl1
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libegl1
      - libvulkan1
  rpm:
    depends:
      - libgcc
      - libwayland-client
      - libwayland-egl
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - libglvnd-egl
      - vulkan-loader
  archlinux:
    depends:
      - gcc-libs
      - wayland
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - libglvnd
      - vulkan-icd-loader

deb:
  fields:
    Uploaders: rom100main <rom100main@proton.me>

rpm:
  packager: lmandrelli <luca.mandrelli@icloud.com>, rom100main <rom100main@proton.me>

archlinux:
  packager: lmandrelli <luca.mandrelli@icloud.com>, rom100main <rom100main@proton.me>
