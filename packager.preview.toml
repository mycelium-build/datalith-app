name = "datalith-preview"
binaries = [{ path = "datalith-preview", main = true }]
product-name = "Datalith Preview"
identifier = "build.mycelium.datalith-preview"
publisher = "Mycelium Build"
description = "A fast, local-first knowledge workspace."
homepage = "https://github.com/mycelium-build/datalith-app"
category = "Productivity"
icons = ["assets/logo/preview/datalith.png", "assets/logo/preview/datalith.icns"]
license-file = "LICENSING.md"
resources = [
  { src = "LICENSE", target = "Licenses/LICENSE" },
  { src = "LICENSING.md", target = "Licenses/LICENSING.md" },
  { src = "THIRD-PARTY-NOTICES.md", target = "Licenses/THIRD-PARTY-NOTICES.md" },
]
formats = ["appimage", "dmg", "nsis"]

[nsis]
installMode = "currentUser"
installer-icon = "assets/logo/preview/datalith.ico"
