# Local Git hooks that mirror CI checks. Managed with prek (a pre-commit compatible runner):
#   prek install          # once per clone; installs the pre-commit and pre-push hooks
#   prek run --all-files  # run every pre-commit hook on the whole tree
# Bypass once with `git commit --no-verify` / `git push --no-verify`. See CONTRIBUTING.md.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Same command as CI's "Check formatting" step.
      - id: cargo-fmt
        name: cargo fmt --check
        language: system
        entry: cargo fmt --all --check
        types: [rust]
        pass_filenames: false

      # The inputs of CI's license-compliance job. Regenerates stale notices in place.
      - id: license-compliance
        name: license compliance
        language: system
        entry: scripts/hooks/license-compliance.sh
        files: ^(Cargo\.toml|Cargo\.lock|deny\.toml|THIRD-PARTY-NOTICES\.md|assets/|scripts/licenses/|scripts/tool-versions\.env$)
        pass_filenames: false

      # Same command as CI's "Run clippy" step, on push only (it compiles the crate).
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --locked --all-targets --quiet
        files: (\.rs$|^Cargo\.(toml|lock)$|^clippy\.toml$|^rust-toolchain\.toml$|^build\.rs$|^\.cargo/)
        pass_filenames: false
        stages: [pre-push]
