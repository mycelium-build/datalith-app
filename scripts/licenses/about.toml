# cargo-about configuration for Datalith.
# Generates the Rust-dependency section of THIRD-PARTY-NOTICES.md.
# See scripts/licenses/generate.sh.

accepted = [
    "GPL-3.0-or-later",
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    "0BSD",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "bzip2-1.0.6",
]

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
private = { ignore = false }

workarounds = ["ring", "rustls", "cocoa"]

# Packages whose manifests lack machine-readable license metadata. Each
# clarification cites the upstream license file from the exact locked revision
# and pins its SHA-256 checksum so drift fails the generation.

[gpui_shared_string.clarify]
license = "Apache-2.0"
files = [
    { path = "LICENSE-APACHE", checksum = "752daf2fb234ca4a1fa372c073fe127f44b7b90fd2529ae44273a64f9d53da7a" },
]

[gpui_util.clarify]
license = "Apache-2.0"
files = [
    { path = "LICENSE-APACHE", checksum = "752daf2fb234ca4a1fa372c073fe127f44b7b90fd2529ae44273a64f9d53da7a" },
]

[cfg_block.clarify]
license = "Apache-2.0"
files = [
    { path = "LICENSE", checksum = "408bbc4d10bdf74d8c9b74b64ea4910603257e24133da18edc4d16198e3b4010" },
]
