# cargo-deny configuration
# Enforces the accepted-license and source policy.
# Run with `cargo deny check`.

[graph]
# The dependency graph is checked for the union of all production targets.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# quick-xml 0.36 is linked only through poem-openapi's XML payload support,
# which the Local Server never uses:
# `RejectXml` rejects every XML media type at the boundary (src/server/api.rs)
# and a spec test asserts no XML content is advertised (src/server/tests.rs).
# RUSTSEC-2026-0194/0195 are therefore unreachable.
# Remove these entries when poem-openapi bumps quick-xml >= 0.41.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic attribute check is unreachable: the Local Server parses no XML" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml namespace-declaration exhaustion is unreachable: the Local Server parses no XML" },
]

[licenses]
confidence-threshold = 0.8
# Single source of truth for the accepted-license allowlist.
# This order is significant: scripts/licenses/sync_allowlist.py mirrors it into scripts/licenses/about.toml,
# where cargo-about treats it as a priority list.
# Do not reorder without regenerating THIRD-PARTY-NOTICES.md.
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    "0BSD",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
