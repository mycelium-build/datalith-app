name: Publish updates
description: Validate the latest Stable and Preview releases and deploy both manifests.
inputs:
  token:
    description: Repository token
    required: true
runs:
  using: composite
  steps:
    - name: Generate channel manifests
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        sudo apt-get update
        sudo apt-get install -y minisign
        for channel in stable preview; do
          python3 scripts/updates/generate_manifest.py --repository "$GITHUB_REPOSITORY" --channel "$channel" --output "update-site/$channel"
        done
        # Legacy paths.
        mkdir -p update-site/updates
        for channel in stable preview; do
          cp "update-site/$channel" "update-site/updates/$channel.json"
        done

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: update-site

    - name: Deploy Pages
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      with:
        token: ${{ inputs.token }}
