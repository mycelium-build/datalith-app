name: Tool versions

# Dependabot does not see the tools pinned in scripts/tool-versions.env (cargo-deny,
# cargo-about, cargo-packager, nFPM). Every Monday this bumps each one to its latest stable
# release published at least COOLDOWN_DAYS ago, regenerates the notices when cargo-about
# changes, and opens (or updates) a single `chore(ci): bump tool versions` PR.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-versions
  cancel-in-progress: false

env:
  BRANCH: chore/tool-versions
  COOLDOWN_DAYS: "7"

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Find new versions
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=scripts/tool-versions.env
          cutoff="$(date -u -d "-${COOLDOWN_DAYS} days" +%s)"
          agent="mycelium-build/datalith-app tool-versions workflow (https://github.com/${GITHUB_REPOSITORY})"
          : > changes.md

          # Newest stable crate version published before the cooldown cutoff.
          crate_version() {
            curl -fsSL -A "$agent" "https://crates.io/api/v1/crates/$1/versions?per_page=100" | jq -r --argjson cutoff "$cutoff" '
              [.versions[]
               | select(.yanked | not)
               | select(.num | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
               | select((.created_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) <= $cutoff)
               | .num]
              | sort_by(split(".") | map(tonumber)) | last // empty'
          }
          # Newest non-prerelease GitHub release published before the cutoff.
          release_version() {
            gh api "repos/$1/releases?per_page=30" --jq "[.[]
              | select(.draft | not) | select(.prerelease | not)
              | select((.published_at | fromdateiso8601) <= $cutoff)
              | .tag_name | ltrimstr(\"v\")] | first // empty"
          }

          bump() {
            local var="$1" latest="$2" current
            current="$(grep -E "^${var}=" "$file" | cut -d= -f2)"
            if [[ -n "$latest" && "$latest" != "$current" ]]; then
              # Only move forward.
              if [[ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" == "$latest" ]]; then
                sed -i "s/^${var}=.*/${var}=${latest}/" "$file"
                echo "- \`${var}\`: ${current} → ${latest}" >> changes.md
              fi
            fi
          }

          bump CARGO_DENY_VERSION "$(crate_version cargo-deny)"
          bump CARGO_ABOUT_VERSION "$(crate_version cargo-about)"
          bump CARGO_PACKAGER_VERSION "$(crate_version cargo-packager)"
          bump NFPM_VERSION "$(release_version goreleaser/nfpm)"

          cat changes.md
          if [[ -s changes.md ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if grep -q CARGO_ABOUT_VERSION changes.md; then echo "about=true" >> "$GITHUB_OUTPUT"; else echo "about=false" >> "$GITHUB_OUTPUT"; fi

      # A new cargo-about can render the notices differently: regenerate them in the same PR.
      - name: Install Rust toolchain
        if: steps.bump.outputs.about == 'true'
        shell: bash
        run: rustup toolchain install

      - name: Load tool versions
        if: steps.bump.outputs.about == 'true'
        shell: bash
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Install cargo-about
        if: steps.bump.outputs.about == 'true'
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - name: Regenerate notices
        if: steps.bump.outputs.about == 'true'
        run: scripts/licenses/generate.sh

      # Mint the write token only after the edits and the generation have finished.
      - name: Create automation token
        if: steps.bump.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push the branch and open or update the PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "datalith-automation[bot]"
          git config user.email "datalith-automation[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add scripts/tool-versions.env THIRD-PARTY-NOTICES.md scripts/licenses/about.toml
          { echo "chore(ci): bump tool versions"; echo; cat changes.md; } > message.txt
          git commit -q -F message.txt
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push -q --force origin "$BRANCH"

          {
            echo "Weekly bump of the tools pinned in \`scripts/tool-versions.env\`, which Dependabot cannot see."
            echo "Each takes its newest stable release published at least ${COOLDOWN_DAYS} days ago."
            echo
            cat changes.md
            echo
            echo "CI checks the license tools on this PR. cargo-packager and nFPM are only exercised by the next release build, so prefer merging before an RC."
            echo "After merging, run \`scripts/install-dev-tools.sh\` locally."
          } > body.md
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --repo "$REPO" --body-file body.md
          else
            gh pr create --repo "$REPO" --head "$BRANCH" --base main \
              --title "chore(ci): bump tool versions" --body-file body.md
          fi
