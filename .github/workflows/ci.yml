name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      INTERNAL_PR: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INTERNAL_PR == 'true' && github.event.pull_request.head.ref || github.sha }}
          persist-credentials: false

      - name: Install Linux dependencies
        run: scripts/install-linux-build-dependencies.sh

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Apply formatting
        if: env.INTERNAL_PR == 'true'
        run: cargo fmt --all

      - name: Check formatting
        if: env.INTERNAL_PR != 'true'
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --locked

      # Mint the write token only after project code has finished running.
      - name: Create formatter token
        if: env.INTERNAL_PR == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Authenticate formatter push
        if: env.INTERNAL_PR == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"

      - name: Commit formatting
        if: env.INTERNAL_PR == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit_message: "chore: apply rustfmt"
          commit_user_name: "datalith-automation[bot]"
          commit_user_email: "datalith-automation[bot]@users.noreply.github.com"
          file_pattern: ":(glob)**/*.rs"
          disable_globbing: true

  license-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install cargo-about and cargo-deny
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-about@0.9.1,cargo-deny@0.20.2

      - name: Run license-compliance checks
        run: scripts/licenses/check.sh
