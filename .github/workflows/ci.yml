name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides what the other jobs must do, so nothing verifies the same inputs twice:
  # - a push to main whose tree was already verified on its PR skips the heavy jobs;
  # - jobs whose inputs did not change are skipped (a skipped required check counts as passed),
  #   including ci when only files it never reads change (docs, contributor and release tooling);
  # - a release-please PR that only bumps the version runs a light check.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      ci-mode: ${{ steps.plan.outputs.ci-mode }}
      licenses: ${{ steps.plan.outputs.licenses }}
      advisories: ${{ steps.plan.outputs.advisories }}
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      # Blobless, not shallow: the diff needs history but only trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Plan jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          # On a PR, HEAD is the merge ref and its first parent is the base it merged with.
          if [[ "$EVENT" == pull_request ]]; then base="$(git rev-parse HEAD^1)"; else base="$BEFORE"; fi
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" HEAD)"
          else
            changed="*" # unknown base: treat everything as changed
            base=""
          fi
          has() { [[ "$changed" == "*" ]] || grep -qE "$1" <<<"$changed"; }
          flag() { if has "$1"; then echo true; else echo false; fi; }

          # check_assets.py checks every tracked file under assets/ against assets/licenses.toml.
          licenses="$(flag '^(Cargo\.(toml|lock)|deny\.toml|THIRD-PARTY-NOTICES\.md|assets/|scripts/licenses/|scripts/lib/tools\.sh$|scripts/tool-versions\.env$|\.github/workflows/ci\.yml$)')"
          # Advisories depend on the advisory database; the daily Advisories workflow covers
          # main. Here they only run when the dependency set changes.
          advisories="$(flag '^(Cargo\.lock|deny\.toml)$')"
          # The update and release-preparation tests also read the packager configurations.
          manifest="$(flag '^(scripts/(updates/|prepare-release\.py$|test_prepare_release\.py$)|packager\.(stable|preview)\.toml$|packaging/|assets/logo/|\.github/workflows/ci\.yml$)')"
          # Files the ci job (fmt, clippy, tests) never reads: docs, contributor and release
          # tooling, other workflows. docs/vault/ is embedded in the binary and read by tests, and
          # ci.yml tests itself, so both count as code. Anything else counts as code too.
          untested='^(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|todo\.txt|renovate\.json|\.pre-commit-config\.yaml|release-please-config\.json|\.release-please-manifest\.json|deny\.toml|nfpm\.yaml|packager\.(stable|preview)\.toml|\.agents/|\.github/|docs/|packaging/|scripts/(hooks|licenses)/|scripts/lib/tools\.sh$|scripts/tool-versions\.env$|scripts/[^/]+\.py$|scripts/updates/[^/]+\.py$)'
          if [[ "$changed" == "*" ]] || grep -vE "$untested" <<<"$changed" | grep -q . \
              || grep -qE '^(docs/vault/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            code=true
          else
            code=false
          fi
          # Inputs of the Rust cache key: main must rebuild to refresh it when they change.
          rust_deps="$(flag '^(Cargo\.(toml|lock)|rust-toolchain\.toml|\.cargo/)')"
          mode=full

          if [[ "$EVENT" == push ]]; then
            tree="$(git rev-parse HEAD^{tree})"
            verified=false
            for pr in $(gh api "repos/$REPO/commits/$SHA/pulls" \
                --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number'); do
              head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
              head_tree="$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)"
              [[ "$head_tree" == "$tree" ]] || continue
              # Latest check run per name, from this workflow's jobs only.
              passed="$(gh api "repos/$REPO/commits/$head/check-runs?filter=latest&per_page=100" --jq '
                [.check_runs[]
                 | select(.app.slug == "github-actions")
                 | select(.name == "ci" or .name == "license-compliance")
                 | select(.conclusion == "success" or .conclusion == "skipped")
                 | .name] | unique | length')"
              if [[ "$passed" == 2 ]]; then
                verified=true
                echo "::notice::Tree $tree was already verified on #$pr at $head: skipping the duplicate run."
                break
              fi
            done
            if $verified; then
              # Only refresh main's caches, and only when their keys change.
              if $rust_deps; then mode=warm; else mode=skip; fi
              licenses=false
              advisories=false
              manifest=false
            fi
          fi

          # A release-please PR is main (already verified) plus a version bump.
          if [[ "$EVENT" == pull_request && "$SAME_REPO" == true && -n "$base" \
                && "$HEAD_REF" == release-please--branches--main* ]]; then
            version_only=true
            if grep -qvE '^(Cargo\.(toml|lock)|CHANGELOG\.md|THIRD-PARTY-NOTICES\.md|\.release-please-manifest\.json)$' <<<"$changed"; then
              version_only=false
            fi
            # In the manifests, only `version = ...` lines may change.
            if git diff --unified=0 "$base" HEAD -- Cargo.toml Cargo.lock \
                | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -qvE '^[-+]version = '; then
              version_only=false
            fi
            if $version_only; then mode=light; fi
          fi

          if ! $code; then
            mode=skip
            echo "::notice::Only files the ci job never reads changed: skipping it."
          fi

          {
            echo "ci-mode=$mode"
            echo "licenses=$licenses"
            echo "advisories=$advisories"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"
          echo "ci-mode=$mode licenses=$licenses advisories=$advisories manifest=$manifest"

  # Every job below runs in full unless plan explicitly says it may be skipped: if plan fails
  # or gives no answer, a skipped required check would count as passed.
  update-manifest:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.manifest != 'false' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test update manifest validation
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 -B -m unittest discover -s scripts/updates -v
          python3 -B -m unittest discover -s scripts -p test_prepare_release.py -v

  # Modes: full (fmt, clippy, tests), light (cargo check, for version-bump-only release PRs),
  # warm (clippy only, to refresh main's Rust cache after an already-verified merge).
  ci:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.ci-mode != 'skip' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      MODE: ${{ needs.plan.outputs.ci-mode || 'full' }}
      INTERNAL_PR: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.INTERNAL_PR == 'true' && github.event.pull_request.head.ref || github.sha }}
          persist-credentials: false

      - name: Install Linux dependencies
        run: scripts/install-linux-build-dependencies.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Apply formatting
        id: fmt
        if: env.INTERNAL_PR == 'true' && env.MODE == 'full'
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Formatting changed: committing it and stopping here. The run on the formatted commit runs clippy and the tests."
          fi

      - name: Check formatting
        if: env.INTERNAL_PR != 'true' && env.MODE == 'full'
        run: cargo fmt --all --check

      # Skipped when formatting changed: this tree will never be merged.
      - name: Run clippy
        if: (env.MODE == 'full' || env.MODE == 'warm') && steps.fmt.outputs.changed != 'true'
        run: cargo clippy --locked --all-targets

      - name: Check the version bump compiles
        if: env.MODE == 'light'
        run: cargo check --locked --all-targets

      - name: Run tests
        if: env.MODE == 'full' && steps.fmt.outputs.changed != 'true'
        run: cargo test --locked

      # Mint the write token only after project code has finished running.
      - name: Create formatter token
        if: steps.fmt.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Authenticate formatter push
        if: steps.fmt.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"

      - name: Commit formatting
        if: steps.fmt.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit_message: "chore: apply rustfmt"
          commit_user_name: "datalith-automation[bot]"
          commit_user_email: "datalith-automation[bot]@users.noreply.github.com"
          file_pattern: ":(glob)**/*.rs"
          disable_globbing: true

  license-compliance:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.licenses != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      LICENSE_CHECK_SKIP_ADVISORIES: ${{ needs.plan.outputs.advisories == 'false' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml, which Renovate bumps.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Install cargo-about and cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Run license-compliance checks
        run: scripts/licenses/check.sh
