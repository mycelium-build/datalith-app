name: Clean up release hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-rc4-hotfix.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete broken rc.3 draft and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/370981559"
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.0-rc.3"

      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/fix-sbom-finalize" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/cleanup-release-hotfix" || true
