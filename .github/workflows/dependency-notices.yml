name: Dependency notices

# THIRD-PARTY-NOTICES.md lists every crate with its version, so each Dependabot Cargo update
# makes license-compliance fail until the notices are regenerated. This regenerates them on
# Dependabot's branch and pushes the result, which reruns CI.
# Needs AUTOMATION_APP_CLIENT_ID and AUTOMATION_APP_PRIVATE_KEY as Dependabot secrets:
# runs triggered by Dependabot do not get the Actions secrets.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-notices-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # The bot's own push has another actor, so it does not retrigger this job.
    if: >-
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/cargo/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml, which Dependabot bumps.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Install cargo-about
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      # cargo-about reads `cargo metadata` and license files: no crate code or build script runs.
      - name: Regenerate notices
        id: generate
        run: |
          scripts/licenses/generate.sh
          if git diff --quiet -- THIRD-PARTY-NOTICES.md scripts/licenses/about.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Mint the write token only after the generation has finished.
      - name: Create automation token
        if: steps.generate.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Authenticate push
        if: steps.generate.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"

      - name: Commit notices
        if: steps.generate.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          commit_message: "chore(deps): regenerate third-party notices"
          commit_user_name: "datalith-automation[bot]"
          commit_user_email: "datalith-automation[bot]@users.noreply.github.com"
          file_pattern: THIRD-PARTY-NOTICES.md scripts/licenses/about.toml
