name: Release

on:
  push:
    tags: ["v[0-9]+.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  artifacts:
    needs: release
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            format: dmg
            artifact: target/aarch64-apple-darwin/release/*.dmg
          - name: Linux x86_64 packages
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: appimage
            artifact: |
              target/x86_64-unknown-linux-gnu/release/*.AppImage
              target/x86_64-unknown-linux-gnu/release/*.deb
              target/x86_64-unknown-linux-gnu/release/*.rpm
              target/x86_64-unknown-linux-gnu/release/*.pkg.tar.zst
          - name: Windows x86_64 installer
            os: windows-2025
            target: x86_64-pc-windows-msvc
            format: nsis
            artifact: target/x86_64-pc-windows-msvc/release/*setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-dependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-packager@0.11.8

      - name: Install nFPM
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt" \
            -o checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package desktop application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.format }}

      - name: Package native Linux formats
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: x86_64
        run: |
          export PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          for packager in deb rpm archlinux; do
            nfpm package \
              --config nfpm.yaml \
              --packager "$packager" \
              --target "target/x86_64-unknown-linux-gnu/release/"
          done

      - name: Upload package to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          draft: true
          files: ${{ matrix.artifact }}
