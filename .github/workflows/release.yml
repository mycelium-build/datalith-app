name: Release

on:
  push:
    tags: ["v[0-9]+.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to finalize. The tag must already exist and its draft
          release must already contain all artifacts (e.g. after a failed or
          intentionally interrupted run). Only the finalize job runs; the
          build matrix is skipped.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  compliance:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install cargo-about and cargo-deny
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-about@0.9.1,cargo-deny@0.20.2

      - name: Run license-compliance checks
        run: scripts/licenses/check.sh

  source:
    if: github.event_name == 'push'
    needs: [release, compliance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Build corresponding-source archive
        run: scripts/licenses/package_source.sh --tag "${GITHUB_REF_NAME}"

      - name: Upload corresponding-source archive
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: datalith-*-corresponding-source.tar.zst

  artifacts:
    if: github.event_name == 'push'
    needs: [release, compliance]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            format: dmg
            artifact: target/aarch64-apple-darwin/release/*.dmg
          - name: macOS Intel DMG
            os: macos-15-intel
            target: x86_64-apple-darwin
            format: dmg
            artifact: target/x86_64-apple-darwin/release/*.dmg
          - name: Linux x86_64 packages
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            format: appimage
            package-arch: x86_64
            artifact: |
              target/x86_64-unknown-linux-gnu/release/*.AppImage
              target/x86_64-unknown-linux-gnu/release/*.deb
              target/x86_64-unknown-linux-gnu/release/*.rpm
              target/x86_64-unknown-linux-gnu/release/*.pkg.tar.zst
          - name: Linux aarch64 packages
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: appimage
            package-arch: aarch64
            artifact: |
              target/aarch64-unknown-linux-gnu/release/*.AppImage
              target/aarch64-unknown-linux-gnu/release/*.deb
              target/aarch64-unknown-linux-gnu/release/*.rpm
              target/aarch64-unknown-linux-gnu/release/*.pkg.tar.zst
          - name: Windows x86_64 installer
            os: windows-2025
            target: x86_64-pc-windows-msvc
            format: nsis
            artifact: target/x86_64-pc-windows-msvc/release/*setup.exe
          - name: Windows ARM64 installer
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            format: nsis
            artifact: target/aarch64-pc-windows-msvc/release/*setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-dependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-packager@0.11.8

      - name: Install nFPM
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
        run: |
          case "$(uname -m)" in
            x86_64) NFPM_ARCH=x86_64 ;;
            aarch64) NFPM_ARCH=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz" \
            -o "nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt" \
            -o checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          tar xzf "nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build release binary
        env:
          DATALITH_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package desktop application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.format }}

      - name: Package native Linux formats
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: ${{ matrix.package-arch }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          export PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          for packager in deb rpm archlinux; do
            nfpm package \
              --config nfpm.yaml \
              --packager "$packager" \
              --target "target/${PACKAGE_TARGET}/release/"
          done

      - name: Upload package to GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          draft: true
          files: ${{ matrix.artifact }}

  finalize:
    needs: [artifacts, source]
    if: >-
      (github.event_name == 'push'
        && needs.artifacts.result == 'success'
        && needs.source.result == 'success')
      || (github.event_name == 'workflow_dispatch'
        && needs.artifacts.result == 'skipped'
        && needs.source.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: datalith
          SYFT_SOURCE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          path: .
          format: spdx-json
          output-file: datalith.sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Rename SBOM with version
        run: |
          VERSION="${RELEASE_TAG#v}"
          mv datalith.sbom.spdx.json "datalith-${VERSION}.spdx.json"

      - name: Validate SBOM
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 scripts/licenses/verify_sbom.py "datalith-${VERSION}.spdx.json" "${VERSION}"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" --dir release-artifacts --clobber

      - name: Stage legal documents and SBOM
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp LICENSE release-artifacts/LICENSE
          cp LICENSE-GPL-3.0 release-artifacts/LICENSE-GPL-3.0
          cp LICENSING.md release-artifacts/LICENSING.md
          cp THIRD-PARTY-NOTICES.md release-artifacts/THIRD-PARTY-NOTICES.md
          cp "datalith-${VERSION}.spdx.json" release-artifacts/

      - name: Upload SBOM and legal documents
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: |
            datalith-*.spdx.json
            LICENSE
            LICENSE-GPL-3.0
            LICENSING.md
            THIRD-PARTY-NOTICES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Create website deployment token
        id: website-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: mycelium-build
          repositories: datalith
          permission-actions: write

      - name: Trigger website deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        with:
          github-token: ${{ steps.website-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'mycelium-build',
              repo: 'datalith',
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                source_ref: process.env.RELEASE_TAG,
              },
            })
