name: Release

on:
  push:
    tags: ["v[0-9]+.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.96.0

      - name: Install cargo-about and cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-about@0.9.1,cargo-deny@0.18.9

      - name: Run license-compliance checks
        run: scripts/licenses/check.sh

  source:
    needs: [release, compliance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.96.0

      - name: Build corresponding-source archive
        run: scripts/licenses/package_source.sh --tag "${GITHUB_REF_NAME}"

      - name: Upload corresponding-source archive
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: datalith-*-corresponding-source.tar.zst

  artifacts:
    needs: [release, compliance]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            format: dmg
            artifact: target/aarch64-apple-darwin/release/*.dmg
          - name: Linux x86_64 packages
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            format: appimage
            artifact: |
              target/x86_64-unknown-linux-gnu/release/*.AppImage
              target/x86_64-unknown-linux-gnu/release/*.deb
              target/x86_64-unknown-linux-gnu/release/*.rpm
              target/x86_64-unknown-linux-gnu/release/*.pkg.tar.zst
          - name: Windows x86_64 installer
            os: windows-2025
            target: x86_64-pc-windows-msvc
            format: nsis
            artifact: target/x86_64-pc-windows-msvc/release/*setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-dependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-packager@0.11.8

      - name: Install nFPM
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt" \
            -o checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build release binary
        env:
          DATALITH_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package desktop application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.format }}

      - name: Package native Linux formats
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: x86_64
          PACKAGE_TARGET: x86_64-unknown-linux-gnu
        run: |
          export PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          for packager in deb rpm archlinux; do
            nfpm package \
              --config nfpm.yaml \
              --packager "$packager" \
              --target "target/${PACKAGE_TARGET}/release/"
          done

      - name: Upload package to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          draft: true
          files: ${{ matrix.artifact }}

  finalize:
    needs: [artifacts, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@04151451f829cb881fd7b3250eccf4021433e14e
        env:
          SYFT_SOURCE_NAME: datalith
          SYFT_SOURCE_VERSION: ${{ github.ref_name }}
        with:
          path: .
          format: spdx-json
          output-file: datalith.sbom.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Rename SBOM with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv datalith.sbom.spdx.json "datalith-${VERSION}.spdx.json"

      - name: Validate SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/licenses/verify_sbom.py "datalith-${VERSION}.spdx.json" "${VERSION}"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts
          gh release download "$GITHUB_REF_NAME" --dir release-artifacts --clobber

      - name: Stage legal documents and SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp LICENSE release-artifacts/LICENSE
          cp LICENSE-GPL-3.0 release-artifacts/LICENSE-GPL-3.0
          cp LICENSING.md release-artifacts/LICENSING.md
          cp THIRD-PARTY-NOTICES.md release-artifacts/THIRD-PARTY-NOTICES.md
          cp "datalith-${VERSION}.spdx.json" release-artifacts/

      - name: Generate SHA256SUMS
        run: scripts/licenses/checksums.sh release-artifacts

      - name: Upload SBOM, checksums and legal documents
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            release-artifacts/SHA256SUMS
            datalith-*.spdx.json
            LICENSE
            LICENSE-GPL-3.0
            LICENSING.md
            THIRD-PARTY-NOTICES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
