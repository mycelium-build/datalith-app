name: Release

on:
  # Release candidates are built through workflow_dispatch from main (see release-rc.yml),
  # so their Rust build caches are saved on main, where later runs can restore them:
  # a run started by a tag cannot read the caches of another tag.
  push:
    tags: ["v[0-9]+.*", "!v*-rc.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build or finalize. The tag must already exist.
        required: true
        type: string
      mode:
        description: >-
          build: build, package and publish the release, as a tag push does.
          package: package, sign and publish the binaries an earlier run built
          (see build_run), without compiling again.
          finalize: only run the finalize job, for a draft release that already
          contains all artifacts (e.g. after a failed or interrupted run).
        required: true
        default: finalize
        type: choice
        options: [finalize, package, build]
      build_run:
        description: >-
          package mode only: ID of the Release run whose built binaries to
          package. Its artifacts expire 7 days after the build.
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    if: github.event_name == 'push' || inputs.mode == 'build'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check the release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\. ]] || { echo "::error::Not a release tag: $RELEASE_TAG"; exit 1; }

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  compliance:
    if: github.event_name == 'push' || inputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml, which Renovate bumps.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Install cargo-about and cargo-deny
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Run license-compliance checks
        run: scripts/licenses/check.sh

  source:
    if: github.event_name == 'push' || inputs.mode == 'build'
    needs: [release, compliance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml, which Renovate bumps.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Build corresponding-source archive
        run: scripts/licenses/package_source.sh --tag "$RELEASE_TAG"

      - name: Upload corresponding-source archive
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: datalith-*-corresponding-source.tar.zst

  # Compiles each target. Packaging and signing run in the package job, so a failure there
  # can be re-run ("Re-run failed jobs") without compiling again.
  build:
    if: github.event_name == 'push' || inputs.mode == 'build'
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: &release-targets
        include:
          - name: macOS Apple Silicon DMG
            os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            format: app,dmg
            artifact: |
              target/aarch64-apple-darwin/release/*.dmg
              target/aarch64-apple-darwin/release/*.app.tar.gz
              target/aarch64-apple-darwin/release/*.sig
          - name: macOS Intel DMG
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            format: app,dmg
            artifact: |
              target/x86_64-apple-darwin/release/*.dmg
              target/x86_64-apple-darwin/release/*.app.tar.gz
              target/x86_64-apple-darwin/release/*.sig
          - name: Linux x86_64 packages
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            format: appimage
            package-arch: x86_64
            artifact: |
              target/x86_64-unknown-linux-gnu/release/*.AppImage
              target/x86_64-unknown-linux-gnu/release/*.sig
              target/x86_64-unknown-linux-gnu/release/*.deb
              target/x86_64-unknown-linux-gnu/release/*.rpm
              target/x86_64-unknown-linux-gnu/release/*.pkg.tar.zst
          - name: Linux aarch64 packages
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            format: appimage
            package-arch: aarch64
            artifact: |
              target/aarch64-unknown-linux-gnu/release/*.AppImage
              target/aarch64-unknown-linux-gnu/release/*.sig
              target/aarch64-unknown-linux-gnu/release/*.deb
              target/aarch64-unknown-linux-gnu/release/*.rpm
              target/aarch64-unknown-linux-gnu/release/*.pkg.tar.zst
          - name: Windows x86_64 installer
            os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            format: nsis
            artifact: |
              target/x86_64-pc-windows-msvc/release/*setup.exe
              target/x86_64-pc-windows-msvc/release/*.sig
          - name: Windows ARM64 installer
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
            format: nsis
            artifact: |
              target/aarch64-pc-windows-msvc/release/*setup.exe
              target/aarch64-pc-windows-msvc/release/*.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-dependencies.sh

      # Installs the toolchain pinned in rust-toolchain.toml, which Renovate bumps.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      # Release candidates build on main (see release-rc.yml) and save this cache there; stable
      # tag runs restore it, since every run can read main's caches. Its key follows the
      # toolchain, Cargo.toml and Cargo.lock, so the RCs of a version and its stable release
      # share it; GitHub evicts entries unused for 7 days. Saved even when a later step fails.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: release
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Stamp release channel
        shell: bash
        run: python scripts/prepare-release.py --tag "$RELEASE_TAG"

      - name: Build release binary
        env:
          DATALITH_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: cargo build --release --locked --target ${{ matrix.target }}


      - name: Upload built binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'datalith.exe' || 'datalith' }}
          if-no-files-found: error
          retention-days: 7

  # Packages, signs, notarizes and uploads the binary built by the build job. A target whose
  # build failed fails here at the download step; the other targets carry on.
  # In package mode it reuses the binaries of the run given in build_run instead.
  package:
    if: >-
      !cancelled()
      && (((github.event_name == 'push' || inputs.mode == 'build')
          && needs.release.result == 'success'
          && needs.compliance.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'package'))
    needs: [release, compliance, build]
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: *release-targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-build-dependencies.sh

      # Installs the toolchain pinned in rust-toolchain.toml, which Renovate bumps.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - name: Install cargo-packager
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # With CI=true, cargo-packager passes --skip-jenkins to create-dmg, which then skips the
      # Finder AppleScript that applies the DMG background, icon positions and window size.
      - name: Let create-dmg lay out the DMG window
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CI=false" >> "$GITHUB_ENV"

      - name: Install nFPM
        if: runner.os == 'Linux'
        run: |
          case "$(uname -m)" in
            x86_64) NFPM_ARCH=x86_64 ;;
            aarch64) NFPM_ARCH=arm64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz" \
            -o "nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt" \
            -o checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          tar xzf "nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz" nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Stamp release channel
        shell: bash
        run: python scripts/prepare-release.py --tag "$RELEASE_TAG"

      - name: Check build run
        if: inputs.mode == 'package'
        env:
          BUILD_RUN: ${{ inputs.build_run }}
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || { echo "::error::package mode needs the build_run ID of a Release run"; exit 1; }

      - name: Download built binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
          run-id: ${{ inputs.mode == 'package' && inputs.build_run || github.run_id }}
          github-token: ${{ inputs.mode == 'package' && github.token || '' }}

      # Artifacts do not keep the executable bit.
      - name: Restore executable bit
        if: runner.os != 'Windows'
        run: chmod +x target/${{ matrix.target }}/release/datalith

      # macOS releases must be signed with a Developer ID Application
      # certificate and notarized; refuse to build them otherwise.
      - name: Prepare macOS signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/release-automation.md)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity"; exit 1 ;;
          esac
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path")
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Verify build identity and prepare packaging
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: python scripts/prepare-release.py --tag "$RELEASE_TAG" --target ${{ matrix.target }}

      - name: Package desktop application
        if: runner.os != 'macOS'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --config target/${{ matrix.target }}/release/packager.json --target ${{ matrix.target }} --formats ${{ matrix.format }}

      # GitHub's macOS runners drop the HTTP/3 (UDP 443) connection that stapler
      # uses to fetch tickets from CloudKit (NSURLErrorDomain -1005, Error 68).
      # Blocking outbound UDP 443 makes it fall back to HTTPS over TCP.
      # https://github.com/actions/runner-images/issues/14924
      - name: Force stapler to use TCP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E

      # cargo-packager signs the app (hardened runtime), notarizes and staples
      # it, then builds and signs the DMG around it.
      - name: Package, sign and notarize macOS application
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo packager --config target/${{ matrix.target }}/release/packager.json --target ${{ matrix.target }} --formats ${{ matrix.format }}

      # cargo-packager does not notarize the DMG itself.
      - name: Notarize and staple macOS disk image
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(target/${{ matrix.target }}/release/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected one DMG, found ${#dmgs[@]}"; exit 1; }
          dmg="${dmgs[0]}"
          result=$(xcrun notarytool submit "$dmg" --wait --output-format json \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          echo "$result"
          status=$(jq -r .status <<<"$result")
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id <<<"$result")" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::DMG notarization status: $status"
            exit 1
          fi
          xcrun stapler staple -v "$dmg"

      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          directory=target/${{ matrix.target }}/release
          apps=("$directory"/*.app)
          dmgs=("$directory"/*.dmg)
          [ "${#apps[@]}" -eq 1 ] && [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected one app and one DMG"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --display --verbose=2 "${apps[0]}" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Timestamp)'
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          codesign --verify --strict --verbose=2 "${dmgs[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmgs[0]}"
          xcrun stapler validate "${dmgs[0]}"

      - name: Remove macOS notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Package native Linux formats
        if: runner.os == 'Linux'
        env:
          PACKAGE_ARCH: ${{ matrix.package-arch }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          export PACKAGE_VERSION="${RELEASE_TAG#v}"
          export PACKAGE_CHANNEL="$(cat CHANNEL)"
          export PACKAGE_STEM="$(python -c 'import json, os; print(json.load(open("target/" + os.environ["PACKAGE_TARGET"] + "/release/packager.json"))["name"])')"
          for packager in deb rpm archlinux; do
            nfpm package \
              --config nfpm.yaml \
              --packager "$packager" \
              --target "target/${PACKAGE_TARGET}/release/"
          done

      - name: Sign updater bundle
        env:
          DATALITH_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.DATALITH_UPDATER_PRIVATE_KEY }}
        run: python scripts/updates/sign.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}

      # action-gh-release updates the release with its target_commitish before uploading,
      # which GITHUB_TOKEN may not do from a run on main for an older tag (HTTP 403).
      # Uploading assets alone does not touch the release.
      - name: Upload package to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_PATTERNS: ${{ matrix.artifact }}
        run: |
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            matches=($pattern)
            [ "${#matches[@]}" -gt 0 ] || { echo "::error::No file matches $pattern"; exit 1; }
            files+=("${matches[@]}")
          done <<<"$ARTIFACT_PATTERNS"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  finalize:
    concurrency:
      group: publish-updates
      cancel-in-progress: false
    environment:
      name: github-pages
    needs: [package, source]
    if: >-
      always()
      && (((github.event_name == 'push' || inputs.mode == 'build')
          && needs.package.result == 'success'
          && needs.source.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'package'
          && needs.package.result == 'success'
          && needs.source.result == 'skipped')
        || (github.event_name == 'workflow_dispatch' && inputs.mode == 'finalize'
          && needs.package.result == 'skipped'
          && needs.source.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Stage release source
        run: |
          mkdir -p release-source
          git archive "refs/tags/$RELEASE_TAG" | tar -x -C release-source

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: datalith
          SYFT_SOURCE_VERSION: ${{ env.RELEASE_TAG }}
        with:
          path: release-source
          format: spdx-json
          output-file: datalith.sbom.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Rename SBOM with version
        run: |
          VERSION="${RELEASE_TAG#v}"
          mv datalith.sbom.spdx.json "datalith-${VERSION}.spdx.json"

      - name: Validate SBOM
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 scripts/licenses/verify_sbom.py "datalith-${VERSION}.spdx.json" "${VERSION}"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" --dir release-artifacts --clobber

      - name: Validate signed updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/updates/generate_manifest.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --assets release-artifacts --output validated-update.json

      - name: Stage legal documents and SBOM
        run: |
          VERSION="${RELEASE_TAG#v}"
          cp release-source/LICENSE release-artifacts/LICENSE
          cp release-source/LICENSING.md release-artifacts/LICENSING.md
          cp release-source/THIRD-PARTY-NOTICES.md release-artifacts/THIRD-PARTY-NOTICES.md
          cp "datalith-${VERSION}.spdx.json" release-artifacts/

      # Uploads assets only, like the package job, so it also works from main.
      - name: Upload SBOM and legal documents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" --clobber \
            "release-artifacts/datalith-${VERSION}.spdx.json" \
            release-artifacts/LICENSE \
            release-artifacts/LICENSING.md \
            release-artifacts/THIRD-PARTY-NOTICES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Create website deployment token
        id: website-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: mycelium-build
          repositories: datalith
          permission-actions: write

      - name: Trigger website deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.website-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'mycelium-build',
              repo: 'datalith',
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                source_ref: process.env.RELEASE_TAG,
              },
            })

      - name: Publish update manifests
        uses: ./.github/actions/publish-updates
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Homebrew tap notification token
        id: homebrew-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: mycelium-build
          repositories: homebrew-tap
          permission-actions: write

      - name: Notify Homebrew tap
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.homebrew-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'mycelium-build',
              repo: 'homebrew-tap',
              workflow_id: 'update.yml',
              ref: 'main',
              inputs: { tag: process.env.RELEASE_TAG, publish: 'true' },
            })
