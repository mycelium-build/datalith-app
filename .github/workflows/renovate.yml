name: Renovate

# Self-hosted Renovate for the three Datalith repositories, acting as the datalith-bot App.
# Global settings: .github/renovate/global.json. Shared rules: .github/renovate/preset.json.
# Each repository opts in with its own renovate.json.
# Runs daily so security updates land the same day; other updates are scheduled for Tuesdays
# by the shared rules.
on:
  schedule:
    # Run daily for security updates; ordinary updates are allowed all Tuesday (Europe/Paris).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-26.04
    # App installation tokens expire after one hour.
    timeout-minutes: 50
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.227.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate itself, and the npm projects it updates.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Renovate runs with binarySource=global: it uses the cargo, npm and tools on PATH.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      # For scripts/renovate-post-upgrade.sh, which regenerates the notices in Cargo updates.
      - name: Install cargo-about
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - name: Create automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: mycelium-build
          repositories: datalith-app,datalith,datalith-clipper

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_CONFIG_FILE: .github/renovate/global.json
          LOG_LEVEL: info
        run: npx --yes "renovate@${RENOVATE_VERSION}"
