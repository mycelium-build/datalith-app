name: Prepare release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Create automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The Rust strategy edits Cargo.toml/Cargo.lock without cargo package.
      - name: Release or prepare next release
        id: release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Draft releases do not create their tag. Push it explicitly so Release
      # builds the installers and publishes the draft only after verification.
      - name: Start binary release from draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })
            for (const release of releases) {
              if (!release.draft || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) continue
              try {
                await github.rest.git.getRef({ ...context.repo, ref: `tags/${release.tag_name}` })
                continue
              } catch (error) {
                if (error.status !== 404) throw error
              }
              const sha = release.target_commitish
              if (!/^[a-f0-9]{40}$/.test(sha)) {
                throw new Error(`Draft ${release.tag_name} must target an exact commit`)
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${sha}...${process.env.TRIGGERING_SHA}`,
              })
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.info(`Waiting for successful CI covering ${release.tag_name}`)
                continue
              }
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/tags/${release.tag_name}`, sha,
              })
            }

      - name: Wait for release PR branch to propagate
        if: steps.release-please.outputs.prs_created == 'true'
        run: sleep 10
        shell: bash

      - name: Verify release PR contains triggering commit
        if: steps.release-please.outputs.prs_created == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_PR: ${{ steps.release-please.outputs.pr }}
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const release = JSON.parse(process.env.RELEASE_PR)
            if (!Number.isInteger(release.number)) {
              core.setFailed('release-please did not return a valid release PR number')
              return
            }

            const response = await github.rest.pulls.get({
              ...context.repo,
              pull_number: release.number,
            })
            const pull = response.data
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`
            if (
              pull.state !== 'open' ||
              pull.base.ref !== 'main' ||
              !pull.head.ref.startsWith('release-please--branches--main') ||
              pull.head.repo?.full_name !== expectedRepository
            ) {
              core.setFailed(`release-please returned unexpected PR #${pull.number}`)
              return
            }

            const triggeringSha = process.env.TRIGGERING_SHA
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${triggeringSha}...${pull.head.sha}`,
            })
            const containsTrigger = ['ahead', 'identical'].includes(comparison.data.status)

            await core.summary
              .addHeading('Release PR ancestry check')
              .addTable([
                [{ data: 'Release PR', header: true }, `#${pull.number}`],
                [{ data: 'Triggering commit', header: true }, triggeringSha],
                [{ data: 'Release PR head', header: true }, pull.head.sha],
                [{ data: 'Comparison', header: true }, comparison.data.status],
              ])
              .write()

            if (!containsTrigger) {
              core.setFailed(
                `Release PR #${pull.number} is stale: triggering commit ${triggeringSha} ` +
                `is not an ancestor of release PR head ${pull.head.sha} ` +
                `(comparison: ${comparison.data.status})`
              )
            }

